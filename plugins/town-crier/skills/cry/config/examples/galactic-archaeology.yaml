# Example configuration: a stellar-streams researcher.
# Only the values that differ from default.yaml are given;
# the `sections` list replaces the default one entirely.

version: 1

period:
  length: 1
  unit: week

sections:

  - title: "Stellar streams"
    subsections:
      - theme: "Stellar streams"
        description: >
          Detection, modelling and dynamics of stellar streams in the Milky Way
          and nearby galaxies, and their use to constrain the dark matter halo
          and its substructure.
        keywords: [stellar stream, tidal stream, GD-1, Pal 5, Sagittarius stream, stream gaps, subhalo]
        sources:
          arxiv: [astro-ph.GA]
        category: 1
        n_papers: 3
      - theme: "Galactic archaeology"
        description: >
          Structure, assembly history and dynamics of the Milky Way from
          large stellar surveys (Gaia, SDSS-V, DESI, Rubin/LSST, Euclid).
        sources:
          arxiv: [astro-ph.GA, astro-ph.SR]
        category: 2

  - title: "Next door"
    subsections:
      - theme: "Cosmology and dark matter"
        sources:
          arxiv: [astro-ph.CO]
        category: 2
        skills:
          extract: extract-paper-cosmology
          summarize: summarize-category-2-cosmology
      - theme: "Galaxy formation and evolution"
        sources:
          arxiv: [astro-ph.GA]
        category: 2
      - theme: "Survey methods and statistics"
        description: Selection functions, survey systematics, inference methods for large surveys.
        sources:
          arxiv: [astro-ph.IM, stat.ME]
        category: 2

  - title: "Science at large"
    subsections:
      - theme: "Major scientific results in any field"
        sources:
          journals: [Nature, Science, Cell, PNAS, Physical Review Letters, The New England Journal of Medicine]
          news: [Nature News, Science news, Quanta Magazine]
        category: 3
