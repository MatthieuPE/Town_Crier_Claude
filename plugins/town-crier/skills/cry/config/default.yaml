# Town Crier — default configuration.
#
# Your own configuration only needs the values that differ from this file.
# A `sections` list in your configuration replaces this one entirely.
# Values in <angle brackets> must be filled in before a run.
# Field reference: schema.md (same folder). Example: configs/ at the repository root.

version: 1

# Where the daily fetch stores papers (GitHub Action, branch `data`).
data:
  repository: MatthieuPE/Town_Crier_Claude
  branch: data

# Covered period. Default: the 7 days ending yesterday.
period:
  length: 1             # number of units
  unit: week            # day | week | month
  end: yesterday        # yesterday | today | YYYY-MM-DD (rolling anchor only)
  anchor: rolling       # rolling: `length` units ending on `end`
                        # calendar: aligned windows (Mon–Sun weeks, half-months, months); set by scheduled tasks

output:
  title: The Town Crier
  language: English     # English, French and Italian have built-in headings
  filename: "town-crier_{start}_{end}.md"
  delivery: file        # Markdown file sent in the conversation
  contents: true        # table of contents under the header

# Used only by the schedule-cry skill.
schedule:
  weekday: monday       # weekly digests
  day_of_month: 1       # monthly digests
  time: "08:00"         # local time
  timezone: null        # IANA name, e.g. Europe/Paris; asked when null
  notifications: none   # none | push | email | push+email

# Review of candidates.
selection:
  title_screen_above: 120   # bigger pools are screened on titles first

# Full text, read for category 1 papers only.
full_text:
  source: alphaxiv          # alphaxiv | abstract  (html: planned)
  sections: [abstract, methods, results, conclusions]

# Per-category defaults; any subsection can override them.
defaults:
  category_1:
    n_papers: 3             # papers summarized
    rank_by: relevance      # relevance (fit to the theme) | impact
    count: true             # show the number of papers of the period on the theme
    list_others: true       # list the other new papers on the theme
  category_2:
    n_papers: 1
    rank_by: impact
    count: true
  category_3:
    n_papers: 3
    rank_by: impact
    count: false
    one_per_field: true     # at most one paper per field
    exclude_fields: []      # e.g. ["Astronomy & astrophysics"]; tags in schema.md

# Output structure: sections > subsections.
# Each subsection uses one theme (a theme-<name> skill) and one summary category.
sections:

  - title: "<SECTION 1 TITLE>"
    subsections:
      - theme: "<THEME A>"      # e.g. stellar-streams
        category: 1
      - theme: "<THEME B>"
        category: 2

  - title: Next door
    subsections:
      - theme: "<CLOSE FIELD 1>"
        category: 2
      - theme: "<CLOSE FIELD 2>"
        category: 2
      - theme: "<CLOSE FIELD 3>"
        category: 2

  - title: Science at large
    subsections:
      - theme: science-at-large
        category: 3
